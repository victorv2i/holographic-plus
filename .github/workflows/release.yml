name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Checksums
        run: (cd dist && sha256sum * > SHA256SUMS)
      - name: Test suite against installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/enfold-artifact"
          "${RUNNER_TEMP}/enfold-artifact/bin/python" -m pip install \
            dist/enfold-*.whl pytest build==1.3.0 \
            "mcp==1.28.1" "sqlite-vec==0.1.9"
          SITE="$("${RUNNER_TEMP}/enfold-artifact/bin/python" -c "import site; print(site.getsitepackages()[0])")"
          mkdir -p "${SITE}/docs"
          cp "${GITHUB_WORKSPACE}/docs/BENCHMARK_PROTOCOL.md" "${SITE}/docs/"
          PYTHONSAFEPATH=1 PYTHONPATH="${SITE}:${GITHUB_WORKSPACE}" \
            "${RUNNER_TEMP}/enfold-artifact/bin/python" -m pytest tests/ -q --override-ini pythonpath= \
            --deselect tests/test_extractor_artifact.py::test_direct_script_with_current_interpreter_measures_its_foreign_tree
      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
