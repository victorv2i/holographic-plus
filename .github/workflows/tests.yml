name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .[test]
      - run: python -m pytest tests/ -q

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - name: First-run path from wheel
        run: |
          python -m venv "${RUNNER_TEMP}/enfold-wheel"
          "${RUNNER_TEMP}/enfold-wheel/bin/python" -m pip install dist/enfold-*.whl
          export PATH="${RUNNER_TEMP}/enfold-wheel/bin:${PATH}"
          CFG="${RUNNER_TEMP}/enfold-first-run/config"
          DATA="${RUNNER_TEMP}/enfold-first-run/data"
          enfold setup --client generic --config-dir "$CFG" --data-dir "$DATA"
          enfold-mcp --self-test --config-dir "$CFG" --data-dir "$DATA"
          enfold doctor
